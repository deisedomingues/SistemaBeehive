<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastrar Aluno | Beehive</title>
  <link rel="stylesheet" href="css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/navegacao.css">
  <link rel="stylesheet" href="css/formularios-academicos.css">
</head>
<body>

  <div class="overlay"></div>

  <main class="container formulario-academico">
    <a href="menu-cadastros.html" class="link-voltar beehive-voltar">
      ← Voltar
    </a>
    <h1>Cadastrar aluno</h1>

    <form class="form" id="form-aluno">

      <div class="formulario-grade">
        <label class="campo-largo">
          Nome completo do aluno
          <input
            type="text"
            id="nome"
            autocomplete="name"
            placeholder="Ex: Maria Silva"
            required
          />
        </label>

        <label>
          Data de nascimento (opcional)
          <input
            type="date"
            id="dataNascimento"
          />
        </label>

        <label>
          Telefone (opcional)
          <input
            type="tel"
            id="telefone"
            placeholder="Ex: (11) 99999-9999"
            autocomplete="tel"
          />
        </label>

        <label class="campo-largo">
          E-mail (opcional)
          <input
            type="email"
            id="email"
            placeholder="Ex: maria@email.com"
            autocomplete="email"
          />
        </label>
      </div>

      <hr style="margin: 6px 0 8px 0; border: none; border-top: 1px solid #eee;">

      <h2>
        Cursos do aluno
      </h2>

      <p class="formulario-ajuda">
        Cadastre cada curso uma vez. O vínculo com empresa ou equipe é definido em cada curso.
      </p>

      <div id="cursos"></div>

      <div style="text-align: right; margin: 4px 0 10px 0;">
        <button
          type="button"
          id="btnAddCurso"
          class="formulario-secundario"
        >
          + Adicionar curso
        </button>
      </div>

      <label style="margin-bottom:10px;">
        Observação (opcional)
        <textarea
          id="observacao"
          placeholder="Ex: aluno tem dificuldade de concentração, prefere aulas no período da manhã..."
          style="padding:8px; min-height:80px; resize:vertical;"
        ></textarea>
      </label>

      <div id="msg" role="status" style="display:none;"></div>

      <button type="submit" class="btn" style="margin-top:6px; padding:12px;">
        Salvar aluno
      </button>
    </form>

  </main>

  <script type="module" src="js/alunos.js"></script>
</body>
</html>
