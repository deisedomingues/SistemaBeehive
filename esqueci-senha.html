<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Beehive | Recuperar senha</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
</head>

<body>

  <div class="overlay"></div>

  <img
    src="images/AbelhinhaAmarela.png"
    alt=""
    class="bee bee-top-left"
  >

  <img
    src="images/AbelhinhaAmarela.png"
    alt=""
    class="bee bee-bottom-right"
  >

  <main class="container">

    <img
      src="images/logo.png"
      alt="Beehive Escola de Idiomas"
      class="logo"
    >

    <h1
      style="
        font-size: 20px;
        margin-bottom: 8px;
      "
    >
      Esqueci minha senha
    </h1>

    <p
      style="
        font-size: 14px;
        margin-bottom: 18px;
        color: #333;
        line-height: 1.5;
      "
    >
      Informe o e-mail utilizado no Beehive.
      Enviaremos um link para você criar uma nova senha.
    </p>

    <div
      id="msg"
      style="
        display: none;
        margin-bottom: 12px;
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
      "
    ></div>

    <form
      class="form"
      id="form-recuperar-senha"
    >

      <label style="margin-bottom: 16px;">
        E-mail

        <input
          type="email"
          id="email"
          required
          autocomplete="email"
          placeholder="Digite seu e-mail"
          style="padding: 10px;"
        >
      </label>

      <button
        type="submit"
        class="btn"
        id="btnEnviar"
        style="padding: 12px;"
      >
        Enviar link
      </button>

      <a
        href="index.html"
        style="
          display: block;
          margin-top: 16px;
          font-size: 14px;
          color: #5f5534;
          font-weight: 600;
          text-align: center;
          text-decoration: underline;
        "
      >
        Voltar para o login
      </a>

    </form>

  </main>

  <script
    type="module"
    src="js/esqueci-senha.js"
  ></script>

</body>
</html>
