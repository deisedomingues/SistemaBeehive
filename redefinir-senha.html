<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Beehive | Criar nova senha</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
</head>

<body>

  <div class="overlay"></div>

  <img
    src="images/AbelhinhaAmarela.png"
    alt=""
    class="bee bee-top-left"
  >

  <img
    src="images/AbelhinhaAmarela.png"
    alt=""
    class="bee bee-bottom-right"
  >

  <main class="container">

    <img
      src="images/logo.png"
      alt="Beehive Escola de Idiomas"
      class="logo"
    >

    <h1
      style="
        font-size: 20px;
        margin-bottom: 8px;
      "
    >
      Criar nova senha
    </h1>

    <p
      id="textoOrientacao"
      style="
        font-size: 14px;
        margin-bottom: 18px;
        color: #333;
        line-height: 1.5;
      "
    >
      Digite e confirme a sua nova senha.
    </p>

    <div
      id="msg"
      style="
        display: none;
        margin-bottom: 12px;
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
      "
    ></div>

    <div
      id="carregandoLink"
      style="
        display: block;
        margin-bottom: 16px;
        font-size: 14px;
        text-align: center;
      "
    >
      Validando o link de recuperação...
    </div>

    <form
      class="form"
      id="form-nova-senha"
      style="display: none;"
    >

      <label style="margin-bottom: 10px;">
        Nova senha

        <input
          type="password"
          id="novaSenha"
          required
          minlength="8"
          autocomplete="new-password"
          placeholder="Digite a nova senha"
          style="padding: 10px;"
        >
      </label>

      <label style="margin-bottom: 8px;">
        Confirmar nova senha

        <input
          type="password"
          id="confirmarSenha"
          required
          minlength="8"
          autocomplete="new-password"
          placeholder="Digite novamente"
          style="padding: 10px;"
        >
      </label>

      <p
        style="
          font-size: 12px;
          color: #555;
          margin-bottom: 16px;
          line-height: 1.4;
        "
      >
        A senha deve possuir pelo menos 8 caracteres.
      </p>

      <button
        type="submit"
        class="btn"
        id="btnSalvar"
        style="padding: 12px;"
      >
        Salvar nova senha
      </button>

    </form>

    <a
      href="index.html"
      id="btnVoltarLogin"
      style="
        display: none;
        margin-top: 16px;
        font-size: 14px;
        color: #5f5534;
        font-weight: 600;
        text-align: center;
        text-decoration: underline;
      "
    >
      Ir para o login
    </a>

  </main>

  <script
    type="module"
    src="js/redefinir-senha.js"
  ></script>

</body>
</html>
