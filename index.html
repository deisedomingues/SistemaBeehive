<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Beehive | Login</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <link rel="stylesheet" href="css/login.css?v=20261116-4" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
</head>

<body class="login-page">

  <!-- camada de fundo -->
  <div class="overlay"></div>

  <div class="login-layout">
    <img class="login-bee login-bee-left" src="images/abelha-login.jpg" alt="" />
    <img class="login-bee login-bee-right" src="images/abelha-login.jpg" alt="" />

    <main class="container login-card">

      <!-- logo -->
      <img
        src="images/logo.png"
        alt="Beehive Escola de Idiomas"
        class="logo"
      >

      <!-- mensagem de boas-vindas -->
      <h1
        style="
          font-size: 20px;
          margin-bottom: 6px;
        "
      >
        Seja bem-vindo(a)!
      </h1>

      <p
        style="
          font-size: 14px;
          margin-bottom: 18px;
          color: #333;
        "
      >
        Faça login para continuar
      </p>

      <!-- mensagem do sistema -->
      <div
        id="msg"
        role="status"
        style="
          display: none;
          margin-bottom: 10px;
          padding: 10px;
          border-radius: 8px;
        "
      ></div>

      <!-- formulário -->
      <form
        class="form"
        id="form-login"
      >

        <label style="margin-bottom: 10px;">
          E-mail

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="Digite seu e-mail"
            style="padding: 10px;"
          >
        </label>

        <label style="margin-bottom: 6px;">
          Senha

          <input
            type="password"
            id="senha"
            required
            autocomplete="current-password"
            placeholder="Digite sua senha"
            style="padding: 10px;"
          >
        </label>

        <!-- recuperação de senha -->
        <div
          style="
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
          "
        >
          <a
            href="esqueci-senha.html"
            style="
              font-size: 13px;
              color: #5f5534;
              font-weight: 600;
              text-decoration: underline;
            "
          >
            Esqueci minha senha
          </a>
        </div>

        <button
          type="submit"
          class="btn"
          id="btnEntrar"
          style="padding: 12px;"
        >
          Entrar
        </button>

      </form>

      <nav aria-label="Redes sociais da Beehive" style="margin-top: 16px; text-align: center; font-size: 13px;">
        <p style="margin: 0 0 4px; color: #333;">Siga-nos</p>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px;">
          <a href="https://www.instagram.com/beehive.idiomas/" target="_blank" rel="noopener noreferrer"
             style="display: inline-flex; align-items: center; gap: 6px; color: #5f5534; font-weight: 600; padding-block: 4px;">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
            <span style="text-decoration: underline;">Instagram</span>
          </a>
          <a href="https://www.tiktok.com/@beehive.idiomas" target="_blank" rel="noopener noreferrer"
             style="display: inline-flex; align-items: center; gap: 6px; color: #5f5534; font-weight: 600; padding-block: 4px;">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
              <path d="M16 2c.3 2.8 1.9 4.5 5 4.7v3.5c-1.8 0-3.5-.6-5-1.6v6.6a6.8 6.8 0 1 1-6.8-6.8c.4 0 .8 0 1.2.1v3.6c-.4-.1-.8-.2-1.2-.2a3.3 3.3 0 1 0 3.3 3.3V2H16Z" />
            </svg>
            <span style="text-decoration: underline;">TikTok</span>
          </a>
        </div>
      </nav>

    </main>
  </div>

  <script
    type="module"
    src="js/login.js"
  ></script>

</body>
</html>
