<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Beehive | Login</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <link rel="stylesheet" href="css/login.css?v=20261116-4" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
</head>

<body class="login-page">

  <!-- camada de fundo -->
  <div class="overlay"></div>

  <div class="login-layout">
    <img class="login-bee login-bee-left" src="images/abelha-login.jpg" alt="" />
    <img class="login-bee login-bee-right" src="images/abelha-login.jpg" alt="" />

    <main class="container login-card">

      <!-- logo -->
      <img
        src="images/logo.png"
        alt="Beehive Escola de Idiomas"
        class="logo"
      >

      <!-- mensagem de boas-vindas -->
      <h1
        style="
          font-size: 20px;
          margin-bottom: 6px;
        "
      >
        Seja bem-vindo(a)!
      </h1>

      <p
        style="
          font-size: 14px;
          margin-bottom: 18px;
          color: #333;
        "
      >
        Faça login para continuar
      </p>

      <!-- mensagem do sistema -->
      <div
        id="msg"
        role="status"
        style="
          display: none;
          margin-bottom: 10px;
          padding: 10px;
          border-radius: 8px;
        "
      ></div>

      <!-- formulário -->
      <form
        class="form"
        id="form-login"
      >

        <label style="margin-bottom: 10px;">
          E-mail

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="Digite seu e-mail"
            style="padding: 10px;"
          >
        </label>

        <label style="margin-bottom: 6px;">
          Senha

          <input
            type="password"
            id="senha"
            required
            autocomplete="current-password"
            placeholder="Digite sua senha"
            style="padding: 10px;"
          >
        </label>

        <!-- recuperação de senha -->
        <div
          style="
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
          "
        >
          <a
            href="esqueci-senha.html"
            style="
              font-size: 13px;
              color: #5f5534;
              font-weight: 600;
              text-decoration: underline;
            "
          >
            Esqueci minha senha
          </a>
        </div>

        <button
          type="submit"
          class="btn"
          id="btnEntrar"
          style="padding: 12px;"
        >
          Entrar
        </button>

      </form>

    </main>
  </div>

  <script
    type="module"
    src="js/login.js"
  ></script>

</body>
</html>
