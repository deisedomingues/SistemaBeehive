<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custos fixos | Beehive</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navegacao.css">
  <link rel="stylesheet" href="css/financeiro.css">
</head>
<body>
  <main class="container financeiro">
    <a href="home-financeiro.html" class="beehive-voltar">← Voltar</a>
    <h1 id="titulo">Custos fixos</h1>
    <p>Pagamentos recorrentes, como remuneração mensal e ajuda de internet.</p>
    <section class="financeiro-painel">
      <h2 id="titulo-form">Novo custo fixo</h2>
      <form id="form-custo" class="form financeiro-grade">
        <label>Favorecido <select name="pessoa"><option value="">Outro favorecido</option></select></label>
        <label id="campo-nome">Nome do favorecido <input name="nome" required maxlength="160"></label>
        <label id="campo-regime" class="campo-largo" hidden>
          Como este fixo entra no fechamento do professor
          <select name="regime">
            <option value="somar">Somar à hora-aula (ex.: ajuda de internet)</option>
            <option value="substituir">Substituir a hora-aula pela remuneração fixa</option>
          </select>
        </label>
        <label class="campo-largo">Descrição <input name="descricao" required maxlength="200"></label>
        <label>Início da vigência <input name="inicio" type="date" required></label>
        <label>Fim da vigência (opcional) <input name="fim" type="date"></label>
        <label>Valor da primeira parcela (R$) <input name="valor1" type="number" min="0.01" step="0.01" required></label>
        <label>Dia de vencimento <input name="dia1" type="number" min="1" max="31" required></label>
        <label>Valor da segunda parcela (opcional) <input name="valor2" type="number" min="0.01" step="0.01"></label>
        <label>Dia da segunda parcela (opcional) <input name="dia2" type="number" min="1" max="31"></label>
        <label class="campo-largo">Observação (opcional) <textarea name="observacao" rows="2"></textarea></label>
        <button class="btn" type="submit" disabled>Salvar custo fixo</button>
      </form>
      <p id="mensagem" role="status"></p>
    </section>
    <section aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Custos cadastrados</h2>
      <div id="lista" class="financeiro-lista">Carregando custos…</div>
    </section>
  </main>
  <script type="module" src="js/financeiro-fixos.js"></script>
</body>
</html>
