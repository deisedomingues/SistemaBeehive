<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastrar empresas ou equipes | Beehive</title>

  <link rel="stylesheet" href="css/style.css" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/navegacao.css">
</head>

<body>

  <div class="overlay"></div>

  <main class="container">

    <h1 style="margin-bottom: 12px;">
      Cadastrar empresas ou equipes
    </h1>

    <form class="form" id="form-empresa">

      <label for="tipo-cadastro">
        Tipo de cadastro
        <select id="tipo-cadastro" name="tipo_cadastro">
          <option value="empresa">Empresa</option>
          <option value="equipe">Equipe</option>
        </select>
      </label>

      <label for="nome">
        Nome da empresa ou equipe
        <input type="text" id="nome" name="nome" placeholder="Ex: Empresa ABC" required>
      </label>

      <div id="campos-empresa">
        <label for="cnpj">
          CNPJ (opcional)
          <input type="text" id="cnpj" name="cnpj" placeholder="Ex: 12.345.678/0001-99">
        </label>

        <label for="email">
          E-mail (opcional)
          <input type="email" id="email" name="email" placeholder="Ex: contato@empresa.com">
        </label>

        <label for="telefone">
          Telefone (opcional)
          <input type="text" id="telefone" name="telefone" placeholder="Ex: (11) 99999-9999">
        </label>
      </div>

      <label for="observacao">
        Observação (opcional)
        <textarea id="observacao" name="observacao" rows="3"></textarea>
      </label>

      <button
        type="submit"
        class="btn"
        style="margin-top:6px; padding:12px;"
      >
        Salvar cadastro
      </button>

    </form>

    <div id="msg" style="display:none; margin-bottom:8px;"></div>

    <a
      href="menu-cadastros.html"
      class="link-voltar beehive-voltar"
      style="margin-top:10px;"
    >
      ← Voltar
    </a>

  </main>

  <script type="module" src="js/empresas.js"></script>

</body>
</html>
